version: "3.8"

services:
  ###############################################################################
  # INFRASTRUCTURE
  ###############################################################################
  db:
    image: mariadb:10.6
    container_name: core-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - core-db-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core-net

  redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - core-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - core-net

  ###############################################################################
  # STP - SIGTRAN M3UA Routing (osmo-stp)
  ###############################################################################
  stp:
    build:
      context: .
      dockerfile: docker/stp/Dockerfile
    container_name: core-stp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - STP_STREAM=${STP_STREAM}
      - STP_AS_NAME=${STP_AS_NAME}
      - STP_ROUTE_MODE=${STP_ROUTE_MODE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    volumes:
      - ./stp/config:/etc/osmocom/stp:ro
      - ./stp/scripts:/usr/local/bin/stp-scripts:ro
    ports:
      - "2905:2905/sctp"
      - "2905:2905/udp"
    command: ["/usr/local/bin/osmo-stp", "-c", "/etc/osmocom/stp/osmo-stp.cfg"]
    healthcheck:
      test: ["CMD", "ss", "-lun", "2905"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - core-net

  ###############################################################################
  # DRA - Diameter Routing Agent
  ###############################################################################
  dra:
    build:
      context: .
      dockerfile: docker/dra/Dockerfile
    container_name: core-dra
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      stp:
        condition: service_healthy
    environment:
      - DRA_PORT=${DRA_PORT}
      - DRA_REALM=${DRA_REALM}
      - DRA_ORIGIN_HOST=${DRA_ORIGIN_HOST}
      - DRA_ORIGIN_REALM=${DRA_ORIGIN_REALM}
      - DRA_PRODUCT_NAME=${DRA_PRODUCT_NAME}
      - DRA_VENDOR_ID=${DRA_VENDOR_ID}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./dra/config:/app/config:ro
      - ./dra/src:/app/src
    ports:
      - "3868:3868/tcp"
      - "3868:3868/udp"
    command: ["python", "/app/src/dra_engine.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 3868)); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - core-net

  ###############################################################################
  # SCP - Service Control Plane (CAMEL/INAP)
  ###############################################################################
  scp:
    build:
      context: .
      dockerfile: docker/scp/Dockerfile
    container_name: core-scp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dra:
        condition: service_healthy
    environment:
      - SCP_PORT=${SCP_PORT}
      - SCP_REALM=${SCP_REALM}
      - SCP_ORIGIN_HOST=${SCP_ORIGIN_HOST}
      - SCP_ORIGIN_REALM=${SCP_ORIGIN_REALM}
      - SCP_CAMEL_PORT=${SCP_CAMEL_PORT}
      - DRA_HOST=${DRA_HOST}
      - DRA_PORT=${DRA_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./scp/config:/app/config:ro
      - ./scp/src:/app/src
    ports:
      - "3869:3868/tcp"
      - "2906:2905/sctp"
    command: ["python", "/app/src/scp_engine.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 3868)); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - core-net

  ###############################################################################
  # UDM - Unified Data Management
  ###############################################################################
  udm:
    build:
      context: .
      dockerfile: docker/udm/Dockerfile
    container_name: core-udm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - UDM_PORT=${UDM_PORT}
      - UDM_REALM=${UDM_REALM}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${UDM_DB_USER}
      - DB_PASSWORD=${UDM_DB_PASSWORD}
      - DB_NAME=${UDM_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./udm/config:/app/config:ro
      - ./udm/src:/app/src
    ports:
      - "8080:8080/tcp"
    command: ["python", "/app/src/udm_server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - core-net

  ###############################################################################
  # OAM - Operations & Maintenance (Vue 2 + Django)
  ###############################################################################
  oam:
    build:
      context: .
      dockerfile: docker/oam/Dockerfile
    container_name: core-oam
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - OAM_PORT=${OAM_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OAM_USER=${OAM_USER}
      - OAM_PASSWORD=${OAM_PASSWORD}
    volumes:
      - ./oam:/app:ro
    ports:
      - "8081:8081/tcp"
    command: ["python", "/app/manage.py", "runserver", "0.0.0.0:8081"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - core-net

  ###############################################################################
  # OBSERVABILITY
  ###############################################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: core-prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090/tcp"
    networks:
      - core-net

  grafana:
    image: grafana/grafana:latest
    container_name: core-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - core-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000/tcp"
    networks:
      - core-net

networks:
  core-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  core-db-data:
  core-redis-data:
  core-grafana-data:
