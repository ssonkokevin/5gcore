! osmo-stp configuration for 5G Core Engine STP/DRA pilot
! Based on production STP/DRA config from stp/net/supervisor/stpSigtran.conf
! and stp/net/srg/config/ + database schema from sql/srg_db.sql
! Instance: ${STP_INSTANCE_ID:-srg01}, Local PC: ${STP_LOCAL_PC:-3.14.4}, NI: ${STP_NI:-natl}

line vty
 no login

cs7-instance 0
 point-code ${STP_LOCAL_PC:-3.14.4}
 network-indicator ${STP_NI:-natl}

! Local ASP (Application Server Process) - binds to all interfaces
asp core-stp-asp 2905 0 m3ua
 local-ip ${STP_LOCAL_IP:-0.0.0.0}
 local-port 2905
 remote-ip 0.0.0.0
 remote-port 2905
 sctp-role ${STP_ASP_MODE:-server}
 sctp-streams 16
! Multi-homed endpoints (from tbl_m3ua_link production config)
! local-ip 102.134.143.10;102.134.143.11
! remote-ip 10.1.250.66;10.1.250.74
 asp! 0

! M3UA Application Server (from tbl_m3ua_as / tbl_m3ua_asp)
as core-stp-as m3ua
 routing-context 1
 traffic-mode loadshare
 asp core-stp-asp
 as! core-stp-as

! Remote linksets (from tbl_m3ua_linkset production)
! MSC_TO_STP     - adjacent PC 0.185.1
! STP_TO_HLR     - adjacent PC 3.15.0
! MSC_TO_STP_2   - adjacent PC 0.183.1
! STP_IWF        - adjacent PC 3.14.2
! STP_SMSC       - adjacent PC 3.14.6
! STP_To_USSD    - adjacent PC 3.15.2
! Safari_USSD    - adjacent PC 0.186.1

! STP route table (mirrors tbl_stp_route: dpc, opc, si, ssn, route_mode)
! From ham_stp1_tbl_stp_route.sql (258 routes)
! Registration routes (IMSI 64120*)
route 3.15.0 0.185.1 3 0 as core-stp-as
route 3.15.0 0.183.1 3 0 as core-stp-as
! HLR -> MSC/SGSN
route 0.185.1 3.15.0 3 8 as core-stp-as
route 0.183.1 3.15.0 3 8 as core-stp-as
! SGSN -> HLR LU Ack
route 3.15.0 0.185.1 3 8 as core-stp-as
route 3.15.0 0.183.1 3 8 as core-stp-as
! IWF (CAMEL/INAP)
route 3.14.2 0.185.1 3 0 as core-stp-as
route 3.14.2 0.183.1 3 0 as core-stp-as
! SMSC
route 3.14.6 0.185.1 3 0 as core-stp-as
route 3.14.6 0.183.1 3 0 as core-stp-as
! USSD
route 3.15.2 0.185.1 3 0 as core-stp-as
route 3.15.2 0.183.1 3 0 as core-stp-as
! Default: route unknown to DRA via M3UA AS
route 0.0.0 0.0.0 3 0 as core-stp-as

! GT translation rules (from tbl_stp_translate production)
! trans_sgsn_1: change NI, prefix manipulation
! trans_sgsn_2: modPrefix on called GT
! trans_smsc_1: replaceGT on called
! trans_smsc_2: replaceGT on called

log file /var/log/osmocom/osmo-stp.log
log level info
log timestamp
