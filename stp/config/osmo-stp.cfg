! osmo-stp configuration for 5G Core Engine STP/DRA pilot
! Based on STP/DRA config patterns from stp/net/supervisor

line vty
 no login

cs7-instance 0
 point-code 1.1.1
 asp core-stp-asp 2905 0 m3ua
  local-ip 0.0.0.0
  remote-ip 0.0.0.0
  sctp-role asp
  ! Route context from tbl_stp_route / ham_stp1_tbl_stp_route.sql
  routing-context 1
  asp! 0
   asp! 0
 asp! 0
 ! M3UA AS definition
 as core-stp-as m3ua
  routing-context 1
  traffic-mode broadcast
  asp core-stp-asp
 as! core-stp-as

! STP route table (mirrors tbl_stp_route: dpc, opc, si, ssn, route_mode)
! Default: route all to DRA
route 0.0.0 0.0.0 3 0 as core-stp-as

log file /var/log/osmocom/osmo-stp.log
log level debug
