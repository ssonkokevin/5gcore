global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "5g-core-engine"
    environment: "lab"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "docker-host"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "osmo-stp"
    static_configs:
      - targets: ["osmo-stp:41100"]
    metrics_path: "/metrics"

  - job_name: "open5gs-dra"
    static_configs:
      - targets: ["open5gs-dra:41100"]
    metrics_path: "/metrics"

  - job_name: "custom-pcf"
    static_configs:
      - targets: ["custom-pcf:7777"]
    metrics_path: "/metrics"

  - job_name: "custom-smf"
    static_configs:
      - targets: ["custom-smf:7778"]
    metrics_path: "/metrics"

  - job_name: "custom-upf"
    static_configs:
      - targets: ["custom-upf:42050"]
    metrics_path: "/metrics"

  - job_name: "gmlc"
    static_configs:
      - targets: ["gmlc:8082"]
    metrics_path: "/metrics"

  - job_name: "scp"
    static_configs:
      - targets: ["scp:3869"]
    metrics_path: "/metrics"

  - job_name: "udm"
    static_configs:
      - targets: ["udm:8080"]
    metrics_path: "/metrics"

  - job_name: "oam"
    static_configs:
      - targets: ["oam:8081"]
    metrics_path: "/metrics"

  - job_name: "free5gc-nrf"
    static_configs:
      - targets: ["nrf:8000"]
    metrics_path: "/metrics"

  - job_name: "free5gc-amf"
    static_configs:
      - targets: ["amf:80"]
    metrics_path: "/metrics"

  - job_name: "free5gc-smf"
    static_configs:
      - targets: ["smf:80"]
    metrics_path: "/metrics"

  - job_name: "free5gc-upf"
    static_configs:
      - targets: ["upf:8805"]
    metrics_path: "/metrics"

  - job_name: "free5gc-ausf"
    static_configs:
      - targets: ["ausf:80"]
    metrics_path: "/metrics"

  - job_name: "free5gc-udm"
    static_configs:
      - targets: ["udm:80"]
    metrics_path: "/metrics"

  - job_name: "free5gc-pcf"
    static_configs:
      - targets: ["pcf:80"]
    metrics_path: "/metrics"

  - job_name: "free5gc-chf"
    static_configs:
      - targets: ["chf:80"]
    metrics_path: "/metrics"

  - job_name: "mariadb"
    static_configs:
      - targets: ["db:3306"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongo:27017"]